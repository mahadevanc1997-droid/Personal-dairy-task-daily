name: Build Daily Journal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q 2026_2027_Digital_Journal_Premium_v5_1_Fixed.zip -d project

      - name: Fix Android project configuration
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Root build.gradle.kts
          root = Path("build.gradle.kts")
          text = root.read_text()

          if 'org.jetbrains.kotlin.plugin.compose' not in text:
              text = text.replace(
                  'id("org.jetbrains.kotlin.android") version "2.0.21" apply false',
                  'id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n'
                  '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'
              )

          root.write_text(text)

          # App build.gradle.kts
          app = Path("app/build.gradle.kts")
          text = app.read_text()

          if 'org.jetbrains.kotlin.plugin.compose' not in text:
              text = text.replace(
                  'id("org.jetbrains.kotlin.android")',
                  'id("org.jetbrains.kotlin.android")\n'
                  '    id("org.jetbrains.kotlin.plugin.compose")'
              )

          if 'compileOptions {' not in text:
              text = text.replace(
                  'targetSdk = 35',
                  '''targetSdk = 35

          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }'''
              )

          app.write_text(text)

          # AndroidX
          props = Path("gradle.properties")
          props.write_text(
              "android.useAndroidX=true\n"
              "android.enableJetifier=true\n"
          )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Android APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Journal-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
